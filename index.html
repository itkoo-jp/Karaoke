<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sotto le Luci - Personal Karaoke</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #1c2136 0%, #14171f 55%, #0e1017 100%);
    color: #EDE8DD;
    font-family: 'Work Sans', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 96px;
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3em;
    color: #8b8f9e;
    margin-bottom: 6px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    margin: 0;
    color: #F4EFE0;
    text-shadow: 0 0 24px rgba(201,162,39,0.25);
    text-align: center;
  }
  .rule {
    width: 64px; height: 2px;
    background: linear-gradient(90deg, transparent, #C9A227, transparent);
    margin: 12px auto 28px;
  }
  .row {
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 640px; margin-bottom: 12px;
  }
  .filebox, .btn-secondary {
    flex: 1 1 220px;
    background: #1D2130; border: 1px solid #2c3145; border-radius: 10px;
    padding: 12px 16px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    color: #c7cad6;
  }
  .btn-secondary { flex: 0 0 auto; font-weight: 600; }
  .btn-secondary.active { background: #C9A227; color: #14171f; }
  input[type=file] { display: none; }
  textarea {
    width: 100%; max-width: 640px; height: 160px;
    background: #161925; color: #d8dbe4; border: 1px solid #2c3145; border-radius: 10px;
    padding: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; line-height: 1.6;
    margin-bottom: 20px; resize: vertical;
  }
  #lyricsBox {
    width: 100%; max-width: 640px; height: 260px; overflow-y: auto;
    background: #12141d; border: 1px solid #262a3a; border-radius: 14px;
    padding: 24px 20px; margin-bottom: 22px;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  .line {
    display: flex; align-items: baseline; gap: 10px;
    padding: 9px 10px; border-radius: 8px; cursor: pointer;
    transition: background 0.3s ease;
  }
  .line .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    transform: translateY(-1px);
  }
  .line .text { font-size: 15px; color: #9295a3; line-height: 1.5; transition: color .25s ease; position: relative; }
  .line.active { background: rgba(201,162,39,0.14); }
  .line.active .dot { background: #C9A227; box-shadow: 0 0 10px 2px rgba(201,162,39,0.7); }
  .line.active .text { font-size: 20px; font-weight: 700; }
  .line.active .text .w { color: #565b6e; transition: color .12s linear; }
  .line.active .text .w.sung { color: #F4EFE0; text-shadow: 0 0 12px rgba(201,162,39,0.5); }
  .line.active .text .w.current { color: #C9A227; }
  .line.past .text { color: #4a4e5e; }
  #placeholder { color: #6b6f80; font-size: 14px; text-align: center; }

  audio { width: 100%; max-width: 640px; margin-bottom: 12px; }

  .timer-wrap { width: 100%; max-width: 640px; }
  .clock {
    text-align: center; font-family: 'IBM Plex Mono', monospace;
    font-size: 28px; color: #F4EFE0; letter-spacing: 0.05em; margin-bottom: 10px;
  }
  .controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
  .ctrl {
    border-radius: 999px; font-weight: 600; cursor: pointer; border: 1px solid #2c3145;
    background: #1D2130; color: #c7cad6; padding: 10px 16px; font-size: 13px;
  }
  .ctrl.primary { background: #C9A227; color: #14171f; border: none; padding: 12px 28px; font-size: 14px; }
  .link-btn {
    background: transparent; color: #6b6f80; border: none; font-size: 12px;
    cursor: pointer; text-decoration: underline;
  }
  .hint { text-align: center; color: #565b6e; font-size: 12px; margin-top: 10px; max-width: 640px; }
  .error {
    text-align: center; color: #e08a7a; font-size: 12px; margin-top: 14px;
    background: rgba(224,138,122,0.08); border: 1px solid rgba(224,138,122,0.25);
    border-radius: 8px; padding: 8px 12px; max-width: 640px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: #C9A227; cursor: pointer; box-shadow: 0 0 0 4px rgba(201,162,39,0.18);
  }
  input[type=range] { -webkit-appearance: none; background: transparent; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #3a3f52; border-radius: 3px; }

  .tap-fixed {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto;
    max-width: 640px; z-index: 100;
    border-radius: 18px 18px 0 0 !important;
    box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

  <div class="eyebrow">PERSONAL KARAOKE STUDIO</div>
  <h1>Sotto le Luci</h1>
  <div class="rule"></div>

  <div class="row">
    <label class="filebox">
      <span id="projectLoadLabel">プロジェクトファイルを読み込む(まとめて復元)</span>
      <span style="color:#C9A227; font-weight:600; white-space:nowrap;">開く</span>
      <input type="file" id="projectLoadInput" accept=".json" />
    </label>
    <div class="btn-secondary" id="projectSaveBtn">プロジェクトを保存</div>
  </div>

  <div class="row">
    <label class="filebox">
      <span id="audioLabel">音源ファイルを選択(伴奏)</span>
      <span style="color:#C9A227; font-weight:600; white-space:nowrap;">開く</span>
      <input type="file" id="audioInput" />
    </label>
    <div class="btn-secondary" id="toggleEdit">歌詞(LRC)を編集</div>
    <div class="btn-secondary" id="autoSplit">長い行を自動分割</div>
  </div>

  <div class="row">
    <label class="filebox">
      <span id="wordTimingLabel">単語タイムスタンプ(LRC)を選択</span>
      <span style="color:#C9A227; font-weight:600; white-space:nowrap;">開く</span>
      <input type="file" id="wordTimingInput" />
    </label>
  </div>

  <textarea id="lrcInput" style="display:none;">[00:00.00]ここに歌詞を貼り付けてください
[00:04.20]LRC形式: [分:秒]歌詞
[00:08.50]上の「歌詞(LRC)を編集」から貼り付け・修正できます</textarea>

  <canvas id="pitchHighway" width="640" height="140" style="display:none; width:100%; max-width:640px; height:140px; background:#0c0e15; border:1px solid #262a3a; border-radius:14px; margin-bottom:14px;"></canvas>

  <div class="row">
    <div class="btn-secondary" id="tapSyncToggle">タップ同期で精度を上げる</div>
    <div class="btn-secondary" id="downloadLrc" style="display:none;">修正後LRCを保存</div>
  </div>

  <div id="tapSyncPanel" style="display:none; width:100%; max-width:640px; margin-bottom:20px;">
    <div style="background:#12141d; border:1px solid #C9A227; border-radius:14px; padding:20px; text-align:center;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8b8f9e; letter-spacing:.2em; margin-bottom:10px;">TAP SYNC</div>
      <div id="tapNextWord" style="font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:#F4EFE0; margin-bottom:6px;">-</div>
      <div id="tapProgress" style="font-size:12px; color:#565b6e; margin-bottom:16px;">0 / 0</div>
      <button id="tapButton" style="width:100%; padding:22px; border-radius:14px; border:none; background:#C9A227; color:#14171f; font-size:17px; font-weight:700; cursor:pointer;">この単語が来たらタップ</button>
      <div style="display:flex; gap:10px; margin-top:12px; justify-content:center;">
        <button id="tapUndo" style="flex:1; padding:10px; border-radius:8px; border:1px solid #2c3145; background:#1D2130; color:#c7cad6; font-size:13px;">ひとつ戻す</button>
        <button id="tapFinish" style="flex:1; padding:10px; border-radius:8px; border:1px solid #2c3145; background:#1D2130; color:#c7cad6; font-size:13px;">終了して保存</button>
      </div>
      <div style="font-size:11.5px; color:#565b6e; margin-top:12px; line-height:1.6;">再生を押してから、画面の単語が実際に歌われた瞬間に大きいボタンをタップしてください。曲の最初から順番に進みます。</div>
    </div>
  </div>

  <div id="lyricsBox"></div>

  <audio id="player" controls style="display:none;"></audio>
  <div style="text-align:center; margin-bottom:20px;">
    <span class="link-btn" id="toggleTimerMode">代わりにタイマーで進める</span>
  </div>

  <div class="timer-wrap" id="timerControls" style="display:none;">
    <div class="clock" id="clock">0:00</div>
    <div class="controls">
      <button class="ctrl" id="back5">−5s</button>
      <button class="ctrl primary" id="playPause">スタート</button>
      <button class="ctrl" id="fwd5">+5s</button>
    </div>
    <div style="text-align:center; margin-top:14px;">
      <span class="link-btn" id="resetTimer">0秒に戻す</span>
    </div>
  </div>

  <div class="hint">歌詞の行をタップすると、その時間にジャンプできます</div>

  <div class="row" style="margin-top:20px;">
    <label class="filebox">
      <span id="pitchLabel">お手本データ(pitch_reference.json)を選択</span>
      <span style="color:#C9A227; font-weight:600; white-space:nowrap;">開く</span>
      <input type="file" id="pitchInput" />
    </label>
    <div class="btn-secondary" id="scoreToggle">採点スタート</div>
  </div>

  <div id="scorePanel" style="display:none; width:100%; max-width:640px; margin-bottom:20px;">
    <div style="background:#12141d; border:1px solid #262a3a; border-radius:14px; padding:20px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;">
        <span style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8b8f9e; letter-spacing:.2em;">LIVE PITCH</span>
        <span id="liveScore" style="font-family:'IBM Plex Mono',monospace; font-size:20px; color:#C9A227;">--</span>
      </div>
      <div style="height:10px; background:#1D2130; border-radius:5px; overflow:hidden;">
        <div id="pitchMeter" style="height:100%; width:50%; background:#565b6e; transition:all .08s linear;"></div>
      </div>
      <div style="text-align:center; margin-top:6px; font-size:11px; color:#565b6e;">左＝低い　右＝高い（中央に近いほど高得点）</div>
    </div>
  </div>

  <div id="finalScore" style="display:none; width:100%; max-width:640px; text-align:center; margin-bottom:20px; padding:24px; background:#12141d; border:1px solid #C9A227; border-radius:14px;">
    <div style="font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8b8f9e; letter-spacing:.3em; margin-bottom:8px;">FINAL SCORE</div>
    <div id="finalScoreNum" style="font-family:'Playfair Display',serif; font-style:italic; font-weight:700; font-size:48px; color:#F4EFE0;">--</div>
  </div>

  <div class="error" id="errorMsg" style="display:none;"></div>

<script>
  let lines = [];
  let useTimerMode = false;
  let timerPlaying = false;
  let timerCurrent = 0;
  let timerOffset = 0;
  let timerStart = 0;
  let rafId = null;
  let lyricWindows = []; // [{start, end}] 歌詞が存在する時間帯だけ音程バーを表示するため
  let audioFileRef = null; // プロジェクト保存用に音源ファイルを保持

  const lyricsBox = document.getElementById('lyricsBox');
  const lrcInput = document.getElementById('lrcInput');
  const toggleEdit = document.getElementById('toggleEdit');
  const audioInput = document.getElementById('audioInput');
  const audioLabel = document.getElementById('audioLabel');
  const player = document.getElementById('player');
  const toggleTimerMode = document.getElementById('toggleTimerMode');
  const timerControls = document.getElementById('timerControls');
  const clockEl = document.getElementById('clock');
  const playPauseBtn = document.getElementById('playPause');
  const errorMsg = document.getElementById('errorMsg');

  function parseLRC(raw) {
    const re = /\[(\d{2}):(\d{2}(?:\.\d{1,2})?)\]/g;
    const out = [];
    raw.split('\n').forEach(line => {
      const matches = [...line.matchAll(re)];
      if (matches.length === 0) return;
      const text = line.replace(re, '').trim();
      if (!text) return;
      matches.forEach(m => {
        const min = parseInt(m[1], 10);
        const sec = parseFloat(m[2]);
        out.push({ time: min * 60 + sec, text });
      });
    });
    return out.sort((a, b) => a.time - b.time);
  }

  function formatClock(t) {
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function computeProportionalWordTimes(l, nextTime) {
    const words = l.text.split(/(\s+)/).filter(w => w.trim() !== '');
    const dur = Math.max(0.5, Math.min(nextTime - l.time, 14));
    const totalChars = words.reduce((s, w) => s + w.length, 0) || 1;
    let acc = 0;
    const wordTimes = words.map(w => {
      const t = l.time + dur * (acc / totalChars);
      acc += w.length;
      return { word: w, time: t };
    });
    return wordTimes;
  }

  function renderLyrics() {
    lyricsBox.innerHTML = '';
    if (lines.length === 0) {
      lyricsBox.innerHTML = '<div id="placeholder">歌詞がありません。「歌詞(LRC)を編集」から貼り付けてください。</div>';
      return;
    }
    lines.forEach((l, i) => {
      const nextTime = (i + 1 < lines.length) ? lines[i + 1].time : l.time + 4;
      if (!l.wordTimes) l.wordTimes = computeProportionalWordTimes(l, nextTime);

      const div = document.createElement('div');
      div.className = 'line';
      div.dataset.idx = i;
      div.innerHTML = '<span class="dot"></span>';
      const textSpan = document.createElement('span');
      textSpan.className = 'text';
      l.wordTimes.forEach((wt, wi) => {
        const wSpan = document.createElement('span');
        wSpan.className = 'w';
        wSpan.textContent = wt.word;
        textSpan.appendChild(wSpan);
        if (wi < l.wordTimes.length - 1) textSpan.appendChild(document.createTextNode(' '));
      });
      div.appendChild(textSpan);
      div.addEventListener('click', () => seekTo(l.time));
      lyricsBox.appendChild(div);
    });
  }

  function updateActiveLine(current) {
    let idx = -1;
    for (let i = 0; i < lines.length; i++) {
      if (lines[i].time <= current) idx = i; else break;
    }
    const els = lyricsBox.querySelectorAll('.line');
    els.forEach((el, i) => {
      el.classList.toggle('active', i === idx);
      el.classList.toggle('past', i < idx);
      if (i === idx && lines[i].wordTimes) {
        const wt = lines[i].wordTimes;
        let sungCount = 0;
        for (let wi = 0; wi < wt.length; wi++) {
          if (wt[wi].time <= current) sungCount = wi + 1; else break;
        }
        const words = el.querySelectorAll('.w');
        words.forEach((w, wi) => {
          w.classList.toggle('sung', wi < sungCount);
          w.classList.toggle('current', wi === sungCount);
        });
      }
    });
    if (idx >= 0 && els[idx]) {
      els[idx].scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
  }

  lines = parseLRC(lrcInput.value);
  renderLyrics();
  buildLyricWindows();
  updateActiveLine(0);

  function formatLRCTime(t) {
    const m = Math.floor(t / 60);
    const s = (t % 60).toFixed(2).padStart(5, '0');
    return String(m).padStart(2, '0') + ':' + s;
  }

  function splitText(text) {
    // まずコンマで分割。要素が1つしかなければ、単語数で分割
    let parts = text.split(/,\s*/).map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) {
      const words = text.split(/\s+/);
      if (words.length > 7) {
        const mid = Math.ceil(words.length / 2);
        parts = [words.slice(0, mid).join(' '), words.slice(mid).join(' ')];
      } else {
        parts = [text];
      }
    }
    return parts;
  }

  const wordTimingInput = document.getElementById('wordTimingInput');
  const wordTimingLabel = document.getElementById('wordTimingLabel');

  function mergeApostropheFragments(tokens) {
    const out = [];
    for (const tk of tokens) {
      const w = tk.word;
      if (out.length > 0 && /^['’]/.test(w) && (tk.time - out[out.length - 1].time) < 0.6) {
        out[out.length - 1].word += w;
      } else {
        out.push({ time: tk.time, word: w });
      }
    }
    return out;
  }

  function normWord(w) {
    return w.toLowerCase().replace(/[.,!?;:"“”()\[\]]/g, '').trim();
  }

  function alignWordsToLines(wordTokens) {
    const merged = mergeApostropheFragments(wordTokens);
    let p = 0; // merged配列のポインタ
    lines.forEach((l, i) => {
      const nextTime = (i + 1 < lines.length) ? lines[i + 1].time : l.time + 4;
      const rawWords = l.text.split(/\s+/).filter(Boolean);
      const wordTimes = [];
      for (let wi = 0; wi < rawWords.length; wi++) {
        if (p < merged.length) {
          wordTimes.push({ word: rawWords[wi], time: merged[p].time });
          p++;
        } else {
          // データが尽きたら直前の間隔を延長して仮の時刻を割り振る
          const prevT = wordTimes.length ? wordTimes[wordTimes.length - 1].time : l.time;
          wordTimes.push({ word: rawWords[wi], time: Math.min(nextTime, prevT + 0.3) });
        }
      }
      l.wordTimes = wordTimes;
      l.wordTimesReal = true;
    });
  }

  wordTimingInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    wordTimingLabel.textContent = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const tokens = parseLRC(reader.result); // {time, text} → wordとして扱う
        const wordTokens = tokens.map(t => ({ time: t.time, word: t.text }));
        alignWordsToLines(wordTokens);
        renderLyrics();
        buildLyricWindows();
        updateActiveLine(useTimerMode ? timerCurrent : (player.src ? player.currentTime : 0));
        errorMsg.style.display = 'none';
      } catch (err) {
        errorMsg.textContent = '単語タイムスタンプの読み込みに失敗しました';
        errorMsg.style.display = 'block';
      }
    };
    reader.readAsText(file);
  });

  // ==================== タップ同期 ====================
  const tapSyncToggle = document.getElementById('tapSyncToggle');
  const tapSyncPanel = document.getElementById('tapSyncPanel');
  const tapNextWord = document.getElementById('tapNextWord');
  const tapProgress = document.getElementById('tapProgress');
  const tapButton = document.getElementById('tapButton');
  const tapUndo = document.getElementById('tapUndo');
  const tapFinish = document.getElementById('tapFinish');
  const downloadLrcBtn = document.getElementById('downloadLrc');

  let flatWords = []; // {lineIdx, wordIdx, word, time}
  let tapIdx = 0;
  let tapSyncActive = false;

  function buildFlatWords() {
    flatWords = [];
    lines.forEach((l, li) => {
      (l.wordTimes || []).forEach((w, wi) => {
        flatWords.push({ lineIdx: li, wordIdx: wi, word: w.word, time: w.time });
      });
    });
  }

  function updateTapUI() {
    tapProgress.textContent = `${tapIdx} / ${flatWords.length}`;
    tapNextWord.textContent = tapIdx < flatWords.length ? flatWords[tapIdx].word : '完了';
  }

  tapSyncToggle.addEventListener('click', () => {
    tapSyncActive = !tapSyncActive;
    if (tapSyncActive) {
      buildFlatWords();
      tapIdx = 0;
      updateTapUI();
      tapSyncPanel.style.display = 'block';
      tapSyncPanel.classList.add('tap-fixed');
      document.body.style.paddingBottom = '280px';
      tapSyncToggle.classList.add('active');
      tapSyncToggle.textContent = 'タップ同期を終了';
    } else {
      tapSyncPanel.style.display = 'none';
      tapSyncPanel.classList.remove('tap-fixed');
      document.body.style.paddingBottom = '';
      tapSyncToggle.classList.remove('active');
      tapSyncToggle.textContent = 'タップ同期で精度を上げる';
    }
  });

  tapButton.addEventListener('click', () => {
    if (tapIdx >= flatWords.length) return;
    const t = useTimerMode ? timerCurrent : (player.src ? player.currentTime : 0);
    flatWords[tapIdx].time = t;
    tapIdx++;
    updateTapUI();
    if (tapIdx >= flatWords.length) {
      applyTapTimes();
    }
  });

  tapUndo.addEventListener('click', () => {
    if (tapIdx > 0) {
      tapIdx--;
      updateTapUI();
    }
  });

  tapFinish.addEventListener('click', () => {
    applyTapTimes();
    tapSyncActive = false;
    tapSyncPanel.style.display = 'none';
    tapSyncPanel.classList.remove('tap-fixed');
    document.body.style.paddingBottom = '';
    tapSyncToggle.classList.remove('active');
    tapSyncToggle.textContent = 'タップ同期で精度を上げる';
  });

  function applyTapTimes() {
    // タップ済みの分だけ実際の時刻を反映する(未タップ分は元のままにする)
    flatWords.forEach((fw, i) => {
      if (i < tapIdx) {
        lines[fw.lineIdx].wordTimes[fw.wordIdx].time = fw.time;
      }
    });
    lines.forEach(l => { l.wordTimesReal = true; });
    renderLyrics();
    buildLyricWindows();
    updateActiveLine(useTimerMode ? timerCurrent : (player.src ? player.currentTime : 0));
    downloadLrcBtn.style.display = 'block';
  }

  function buildWordLrcText() {
    const out = [];
    lines.forEach(l => {
      (l.wordTimes || []).forEach(w => {
        out.push(`[${formatLRCTime(w.time)}]${w.word}`);
      });
    });
    return out.join('\n');
  }

  downloadLrcBtn.addEventListener('click', () => {
    const blob = new Blob([buildWordLrcText()], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'lyrics_words_corrected.lrc';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  // ==================== プロジェクトの保存・読み込み ====================
  const projectLoadInput = document.getElementById('projectLoadInput');
  const projectLoadLabel = document.getElementById('projectLoadLabel');
  const projectSaveBtn = document.getElementById('projectSaveBtn');

  projectSaveBtn.addEventListener('click', () => {
    const finish = (audioDataUrl) => {
      const project = {
        audioName: audioFileRef ? audioFileRef.name : null,
        audioDataUrl: audioDataUrl,
        lrcText: lrcInput.value,
        pitchJson: referenceCurve,
        wordLrcText: lines.some(l => l.wordTimesReal) ? buildWordLrcText() : null,
      };
      const blob = new Blob([JSON.stringify(project)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'karaoke_project.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    };
    if (audioFileRef) {
      const reader = new FileReader();
      reader.onload = () => finish(reader.result);
      reader.readAsDataURL(audioFileRef);
    } else {
      finish(null);
    }
  });

  projectLoadInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    projectLoadLabel.textContent = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);

        if (data.audioDataUrl) {
          player.src = data.audioDataUrl;
          player.style.display = 'block';
          player.load();
          audioLabel.textContent = data.audioName || '音源(プロジェクトから復元)';
          audioFileRef = null; // data URLはFile参照ではないため保存時は再度読み込みが必要
          useTimerMode = false;
          timerControls.style.display = 'none';
          toggleTimerMode.parentElement.style.display = 'block';
        }

        if (typeof data.lrcText === 'string') {
          lrcInput.value = data.lrcText;
          lines = parseLRC(lrcInput.value);
        }

        if (data.pitchJson) {
          referenceCurve = data.pitchJson;
          referenceNotes = buildNotes(referenceCurve);
          pitchLabel.textContent = 'ピッチデータ(プロジェクトから復元)';
          highway.style.display = 'block';
          startHighwayLoop();
        }

        if (typeof data.wordLrcText === 'string' && data.wordLrcText) {
          const tokens = parseLRC(data.wordLrcText);
          const wordTokens = tokens.map(t => ({ time: t.time, word: t.text }));
          alignWordsToLines(wordTokens);
          wordTimingLabel.textContent = '単語タイミング(プロジェクトから復元)';
        }

        renderLyrics();
        buildLyricWindows();
        updateActiveLine(0);
        errorMsg.style.display = 'none';
      } catch (err) {
        errorMsg.textContent = 'プロジェクトファイルの読み込みに失敗しました';
        errorMsg.style.display = 'block';
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('autoSplit').addEventListener('click', () => {
    const parsed = parseLRC(lrcInput.value);
    if (parsed.length === 0) return;
    const outLines = [];
    parsed.forEach((l, i) => {
      const nextT = (i + 1 < parsed.length) ? parsed[i + 1].time : l.time + 6;
      const dur = Math.max(0.5, Math.min(nextT - l.time, 14));
      const parts = splitText(l.text);
      if (parts.length === 1) {
        outLines.push(`[${formatLRCTime(l.time)}]${l.text}`);
        return;
      }
      const totalChars = parts.reduce((s, p) => s + p.length, 0) || 1;
      let acc = 0;
      parts.forEach((p) => {
        const t = l.time + dur * (acc / totalChars);
        outLines.push(`[${formatLRCTime(t)}]${p}`);
        acc += p.length;
      });
    });
    lrcInput.value = outLines.join('\n');
    lines = parseLRC(lrcInput.value);
    renderLyrics();
    buildLyricWindows();
    updateActiveLine(useTimerMode ? timerCurrent : player.currentTime || 0);
  });

  lrcInput.addEventListener('input', () => {
    lines = parseLRC(lrcInput.value);
    renderLyrics();
    buildLyricWindows();
    updateActiveLine(useTimerMode ? timerCurrent : player.currentTime || 0);
  });

  toggleEdit.addEventListener('click', () => {
    const showing = lrcInput.style.display !== 'none';
    lrcInput.style.display = showing ? 'none' : 'block';
    toggleEdit.classList.toggle('active', !showing);
    toggleEdit.textContent = showing ? '歌詞(LRC)を編集' : '編集を閉じる';
    if (!showing) {
      lrcInput.focus();
      lrcInput.select();
    }
  });

  audioInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    errorMsg.style.display = 'none';
    audioLabel.textContent = file.name;
    audioFileRef = file;
    const url = URL.createObjectURL(file);
    player.src = url;
    player.style.display = 'block';
    player.load();
    useTimerMode = false;
    timerControls.style.display = 'none';
    toggleTimerMode.parentElement.style.display = 'block';
  });

  player.addEventListener('error', () => {
    errorMsg.textContent = 'この音声ファイルを読み込めませんでした。下の「代わりにタイマーで進める」をお試しください。';
    errorMsg.style.display = 'block';
  });

  player.addEventListener('timeupdate', () => {
    updateActiveLine(player.currentTime);
  });

  function seekTo(t) {
    if (useTimerMode) {
      timerOffset = t;
      timerStart = performance.now();
      timerCurrent = t;
      clockEl.textContent = formatClock(t);
      updateActiveLine(t);
    } else if (player.src) {
      player.currentTime = t;
      updateActiveLine(t);
    }
  }

  // ---- Timer mode ----
  toggleTimerMode.addEventListener('click', () => {
    useTimerMode = true;
    timerControls.style.display = 'block';
    player.pause();
    player.style.display = 'none';
    toggleTimerMode.parentElement.style.display = 'none';
    timerCurrent = 0;
    timerOffset = 0;
    timerPlaying = false;
    clockEl.textContent = '0:00';
    playPauseBtn.textContent = 'スタート';
    updateActiveLine(0);
  });

  function tick(now) {
    timerCurrent = (now - timerStart) / 1000 + timerOffset;
    clockEl.textContent = formatClock(timerCurrent);
    updateActiveLine(timerCurrent);
    if (timerPlaying) rafId = requestAnimationFrame(tick);
  }

  playPauseBtn.addEventListener('click', () => {
    if (timerPlaying) {
      timerOffset = timerCurrent;
      timerPlaying = false;
      playPauseBtn.textContent = 'スタート';
      cancelAnimationFrame(rafId);
    } else {
      timerStart = performance.now();
      timerPlaying = true;
      playPauseBtn.textContent = '一時停止';
      rafId = requestAnimationFrame(tick);
    }
  });

  document.getElementById('back5').addEventListener('click', () => {
    const t = Math.max(0, (useTimerMode ? timerCurrent : player.currentTime) - 5);
    seekTo(t);
  });
  document.getElementById('fwd5').addEventListener('click', () => {
    const t = (useTimerMode ? timerCurrent : player.currentTime) + 5;
    seekTo(t);
  });
  document.getElementById('resetTimer').addEventListener('click', () => {
    timerPlaying = false;
    timerOffset = 0;
    timerCurrent = 0;
    cancelAnimationFrame(rafId);
    clockEl.textContent = '0:00';
    playPauseBtn.textContent = 'スタート';
    updateActiveLine(0);
  });

  timerControls.style.display = 'none';

  // ==================== 採点機能 ====================
  const pitchInput = document.getElementById('pitchInput');
  const pitchLabel = document.getElementById('pitchLabel');
  const scoreToggle = document.getElementById('scoreToggle');
  const scorePanel = document.getElementById('scorePanel');
  const liveScoreEl = document.getElementById('liveScore');
  const pitchMeter = document.getElementById('pitchMeter');
  const finalScoreBox = document.getElementById('finalScore');
  const finalScoreNum = document.getElementById('finalScoreNum');

  let referenceCurve = null; // [{t, hz}]
  let referenceNotes = null; // [{start,end,hz}] 連続音をまとめたノート
  let scoring = false;
  let audioCtx = null;
  let analyser = null;
  let micStream = null;
  let scoreSamples = []; // 0-100 per frame
  let scoreRafId = null;
  let liveHz = 0;

  const highway = document.getElementById('pitchHighway');
  const hctx = highway.getContext('2d');
  let highwayRafId = null;

  function buildNotes(curve) {
    const notes = [];
    let cur = null;
    for (const p of curve) {
      if (p.hz) {
        if (cur && Math.abs(1200 * Math.log2(p.hz / cur.hz)) < 60 && p.t - cur.end < 0.12) {
          cur.end = p.t;
        } else {
          if (cur) notes.push(cur);
          cur = { start: p.t, end: p.t, hz: p.hz };
        }
      } else {
        if (cur) { notes.push(cur); cur = null; }
      }
    }
    if (cur) notes.push(cur);
    return notes;
  }

  pitchInput.addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    pitchLabel.textContent = file.name;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        referenceCurve = JSON.parse(reader.result);
        referenceNotes = buildNotes(referenceCurve);
        errorMsg.style.display = 'none';
        highway.style.display = 'block';
        startHighwayLoop();
      } catch (err) {
        errorMsg.textContent = 'pitch_reference.jsonの読み込みに失敗しました';
        errorMsg.style.display = 'block';
      }
    };
    reader.readAsText(file);
  });

  const HZ_MIN = 80, HZ_MAX = 500; // 表示するピッチ範囲(log scale)
  function hzToY(hz, h) {
    const lo = Math.log2(HZ_MIN), hi = Math.log2(HZ_MAX);
    const v = Math.max(lo, Math.min(hi, Math.log2(hz)));
    return h - ((v - lo) / (hi - lo)) * h;
  }

  const WINDOW_BEFORE = 1.2, WINDOW_AFTER = 3.0; // 再生位置の前後何秒を表示するか
  const PLAYHEAD_RATIO = WINDOW_BEFORE / (WINDOW_BEFORE + WINDOW_AFTER);

  let highwayCssW = 640, highwayCssH = 140;

  function buildLyricWindows() {
    const hasWordTimes = lines.length > 0 && lines[0].wordTimes && lines[0].wordTimesReal;
    if (hasWordTimes) {
      // 単語ごとの実データがある場合は、単語単位のタイトなウィンドウを作る
      const windows = [];
      lines.forEach((l, i) => {
        const wt = l.wordTimes;
        const nextLineT = (i + 1 < lines.length) ? lines[i + 1].time : l.time + 6;
        wt.forEach((w, wi) => {
          const nextWordT = (wi + 1 < wt.length) ? wt[wi + 1].time : nextLineT;
          windows.push({ start: w.time - 0.15, end: Math.min(nextWordT, w.time + 1.2) });
        });
      });
      lyricWindows = windows;
    } else {
      lyricWindows = lines.map((l, i) => {
        const nextT = (i + 1 < lines.length) ? lines[i + 1].time : l.time + 6;
        return { start: l.time - 0.3, end: Math.min(nextT, l.time + 8) };
      });
    }
  }

  function isInLyricWindow(t) {
    if (lyricWindows.length === 0) return true; // 歌詞データが無ければ制限しない
    return lyricWindows.some(w => t >= w.start && t <= w.end);
  }

  function drawHighway() {
    const w = highwayCssW, h = highwayCssH;
    hctx.clearRect(0, 0, w, h);
    if (!referenceNotes) return;

    const t = useTimerMode ? timerCurrent : (player.src ? player.currentTime : 0);
    const winStart = t - WINDOW_BEFORE, winEnd = t + WINDOW_AFTER;
    const pxPerSec = w / (WINDOW_BEFORE + WINDOW_AFTER);

    // ノートバーを描画(歌詞が存在する時間帯のみ)
    for (const n of referenceNotes) {
      if (n.end < winStart || n.start > winEnd) continue;
      if (!isInLyricWindow(n.start)) continue;
      const x1 = (n.start - winStart) * pxPerSec;
      const x2 = (n.end - winStart) * pxPerSec;
      const y = hzToY(n.hz, h);
      hctx.fillStyle = (n.start <= t && n.end >= t) ? '#C9A227' : 'rgba(201,162,39,0.55)';
      hctx.beginPath();
      hctx.roundRect ? hctx.roundRect(x1, y - 4, Math.max(2, x2 - x1), 8, 4) : hctx.rect(x1, y - 4, Math.max(2, x2 - x1), 8);
      hctx.fill();
    }

    // プレイヘッド(現在地)の縦線
    const px = w * PLAYHEAD_RATIO;
    hctx.strokeStyle = 'rgba(237,232,224,0.35)';
    hctx.lineWidth = 1;
    hctx.beginPath(); hctx.moveTo(px, 0); hctx.lineTo(px, h); hctx.stroke();

    // 自分の声(ライブピッチ)をプレイヘッド上に表示
    if (scoring && liveHz > 0) {
      const y = hzToY(liveHz, h);
      hctx.fillStyle = '#e08a7a';
      hctx.beginPath();
      hctx.arc(px, y, 6, 0, Math.PI * 2);
      hctx.fill();
    }

    highwayRafId = requestAnimationFrame(drawHighway);
  }

  function startHighwayLoop() {
    const rect = highway.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    highwayCssW = rect.width;
    highwayCssH = rect.height;
    highway.width = rect.width * dpr;
    highway.height = rect.height * dpr;
    hctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cancelAnimationFrame(highwayRafId);
    drawHighway();
  }

  function hzAtTime(t) {
    if (!referenceCurve || referenceCurve.length === 0) return null;
    // 最も近い時刻のデータを線形探索(データ数が多い場合は二分探索が理想だが簡易実装)
    let lo = 0, hi = referenceCurve.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (referenceCurve[mid].t < t) lo = mid + 1; else hi = mid;
    }
    return referenceCurve[lo] ? referenceCurve[lo].hz : null;
  }

  function hzToCents(hz, refHz) {
    if (!hz || !refHz) return null;
    return 1200 * Math.log2(hz / refHz);
  }

  // 自己相関法によるシンプルなピッチ検出
  function autoCorrelate(buf, sampleRate) {
    const SIZE = buf.length;
    let rms = 0;
    for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1; // 無音

    let r1 = 0, r2 = SIZE - 1;
    const thres = 0.2;
    for (let i = 0; i < SIZE / 2; i++) { if (Math.abs(buf[i]) < thres) { r1 = i; break; } }
    for (let i = 1; i < SIZE / 2; i++) { if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; } }
    const trimmed = buf.slice(r1, r2);
    const n = trimmed.length;
    const c = new Array(n).fill(0);
    for (let lag = 0; lag < n; lag++) {
      for (let i = 0; i < n - lag; i++) c[lag] += trimmed[i] * trimmed[i + lag];
    }
    let d = 0;
    while (c[d] > c[d + 1]) d++;
    let maxVal = -1, maxPos = -1;
    for (let i = d; i < n; i++) {
      if (c[i] > maxVal) { maxVal = c[i]; maxPos = i; }
    }
    let T0 = maxPos;
    if (T0 <= 0) return -1;
    return sampleRate / T0;
  }

  async function startScoring() {
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      errorMsg.textContent = 'マイクへのアクセスが許可されませんでした';
      errorMsg.style.display = 'block';
      return;
    }
    if (!referenceCurve) {
      errorMsg.textContent = 'お手本データ(pitch_reference.json)を先に選択してください';
      errorMsg.style.display = 'block';
      return;
    }
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    source.connect(analyser);

    scoring = true;
    scoreSamples = [];
    scorePanel.style.display = 'block';
    finalScoreBox.style.display = 'none';
    scoreToggle.textContent = '採点ストップ';
    scoreToggle.classList.add('active');

    const buf = new Float32Array(analyser.fftSize);
    function loop() {
      if (!scoring) return;
      analyser.getFloatTimeDomainData(buf);
      const hz = autoCorrelate(buf, audioCtx.sampleRate);
      const t = useTimerMode ? timerCurrent : player.currentTime;
      const refHz = hzAtTime(t);

      if (hz > 0 && refHz) {
        liveHz = hz;
        const cents = hzToCents(hz, refHz);
        const clamped = Math.max(-100, Math.min(100, cents));
        pitchMeter.style.width = (50 + clamped / 2) + '%';
        pitchMeter.style.background = Math.abs(cents) < 50 ? '#C9A227' : '#e08a7a';
        const frameScore = Math.max(0, 100 - Math.abs(cents));
        scoreSamples.push(frameScore);
        liveScoreEl.textContent = Math.round(frameScore);
      } else {
        liveHz = hz > 0 ? hz : 0;
        pitchMeter.style.width = '50%';
        pitchMeter.style.background = '#565b6e';
        liveScoreEl.textContent = '--';
      }
      scoreRafId = requestAnimationFrame(loop);
    }
    loop();
  }

  function stopScoring() {
    scoring = false;
    liveHz = 0;
    cancelAnimationFrame(scoreRafId);
    if (micStream) micStream.getTracks().forEach(t => t.stop());
    if (audioCtx) audioCtx.close();
    scoreToggle.textContent = '採点スタート';
    scoreToggle.classList.remove('active');

    if (scoreSamples.length > 0) {
      const avg = scoreSamples.reduce((a, b) => a + b, 0) / scoreSamples.length;
      finalScoreNum.textContent = avg.toFixed(1);
      finalScoreBox.style.display = 'block';
    }
  }

  scoreToggle.addEventListener('click', () => {
    if (scoring) stopScoring(); else startScoring();
  });
</script>

</body>
</html>
